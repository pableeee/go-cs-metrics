<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 Round Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;display:flex;height:100vh;overflow:hidden;user-select:none}

/* ── Sidebar ── */
#sidebar{width:270px;flex-shrink:0;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
#sb-header{padding:10px 12px;border-bottom:1px solid #30363d;flex-shrink:0}
#sb-header h2{font-size:13px;font-weight:600;color:#58a6ff}
#sb-header p{font-size:11px;color:#8b949e;margin-top:2px}
#clip-list{flex:1;overflow-y:auto;padding:4px 0}
#clip-list::-webkit-scrollbar{width:4px}
#clip-list::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
.clip-item{padding:8px 12px;cursor:pointer;border-left:3px solid transparent;transition:background 0.1s}
.clip-item:hover{background:#21262d}
.clip-item.active{background:#21262d;border-left-color:#58a6ff}
.ci-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ci-date{font-size:10px;color:#8b949e}
.ci-map{font-size:10px;font-weight:600;color:#79c0ff}
.ci-match{font-size:11px;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.ci-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ci-rnd{font-size:10px;color:#8b949e}
.tag-smk{font-size:10px;color:#79c0ff}
.tag-fla{font-size:10px;color:#f0c000}
.tag-mol{font-size:10px;color:#f97316}
.won-t{background:#f97316;color:#000;font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px}
.won-ct{background:#38bdf8;color:#000;font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px}
.def-badge{font-size:10px;color:#f85149}
.plant-badge{font-size:10px;color:#ffd700}
.entry-t{font-size:10px;color:#f97316}
.entry-ct{font-size:10px;color:#38bdf8}
.buy-full{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;background:#2ea043;color:#fff}
.buy-force{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;background:#d29922;color:#000}
.buy-eco{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;background:#444;color:#ccc}
.buy-pistol{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;background:#333;color:#aaa}

/* ── Main area ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#hdr{padding:8px 14px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;align-items:center;gap:10px;min-height:42px}
#hdr-map{font-size:14px;font-weight:700;color:#58a6ff}
#hdr-round{font-size:12px;color:#e6edf3}
#hdr-util{font-size:11px;color:#8b949e}
#hdr-outcome{font-size:11px;font-weight:600}
#hdr-outcome.t-won{color:#f97316}
#hdr-outcome.ct-won{color:#4fc3f7}
#hdr-empty{font-size:13px;color:#6e7681}

#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#0d1117;position:relative;overflow:hidden}
canvas{display:block;cursor:crosshair}

/* ── Controls ── */
#controls{padding:8px 14px;background:#161b22;border-top:1px solid #30363d;flex-shrink:0;display:flex;align-items:center;gap:10px;min-height:46px}
#play-btn{background:#238636;border:none;color:#fff;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;height:28px;flex-shrink:0}
#play-btn:hover{background:#2ea043}
#timeline{flex:1;accent-color:#2ea043;cursor:pointer;min-width:0}
.spd-btns{display:flex;gap:3px;flex-shrink:0}
.spd-btn{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:2px 7px;border-radius:4px;cursor:pointer;font-size:11px}
.spd-btn:hover{background:#30363d;color:#e6edf3}
.spd-btn.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
#tick-lbl{font-size:11px;color:#8b949e;min-width:60px;text-align:right;flex-shrink:0}
#no-data{display:flex;align-items:center;justify-content:center;height:100%;color:#6e7681;font-size:14px}

/* ── Kill feed ── */
#killfeed{position:absolute;bottom:10px;right:10px;width:220px;max-height:45%;display:flex;flex-direction:column;gap:3px;overflow:hidden;pointer-events:none;z-index:10}
.kf-entry{background:rgba(13,17,23,0.85);border-left:3px solid #444;border-radius:2px;padding:3px 7px;font-size:11px;line-height:1.5;transition:opacity 0.3s}
.kf-atk{font-weight:600}
.kf-wep{color:#8b949e;font-size:10px;margin:0 4px}
.kf-sep{color:#6e7681;margin:0 2px}
.kf-vic{font-weight:600}
.kf-hs{color:#f0c000;font-size:9px;font-weight:700;margin-left:3px}

/* ── HP panels ── */
.hp-panel{position:absolute;top:8px;width:135px;display:flex;flex-direction:column;gap:2px;pointer-events:none;z-index:10}
#hp-ct{left:8px}
#hp-t{right:8px}
.hp-hdr{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 3px;margin-bottom:2px}
.hp-row{background:rgba(13,17,23,0.80);border-radius:2px;padding:3px 5px;transition:opacity 0.2s}
.hp-row.hp-dead{opacity:0.4}
.hp-name-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.hp-name{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95px}
.hp-val{font-size:10px;color:#8b949e;flex-shrink:0}
.hp-bar-wrap{height:3px;background:#21262d;border-radius:2px}
.hp-bar{height:100%;border-radius:2px;transition:width 0.1s}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sb-header">
    <h2>Round Viewer</h2>
    <p id="sb-count"></p>
  </div>
  <div id="clip-list"></div>
</div>

<div id="main">
  <div id="hdr">
    <span id="hdr-empty">← Select a round from the list</span>
    <span id="hdr-map" style="display:none"></span>
    <span id="hdr-round" style="display:none"></span>
    <span id="hdr-util" style="display:none"></span>
    <span id="hdr-outcome" style="display:none"></span>
  </div>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="hp-panel" id="hp-ct"><div class="hp-hdr" style="color:#4fc3f7">CT</div></div>
    <div class="hp-panel" id="hp-t"><div class="hp-hdr" style="color:#f97316">T</div></div>
    <div id="killfeed"></div>
  </div>
  <div id="controls">
    <button id="play-btn" onclick="togglePlay()" disabled>▶ Play</button>
    <input id="timeline" type="range" min="0" max="100" value="0" step="0.5"
           oninput="onScrub(this.value)" disabled>
    <div class="spd-btns">
      <button class="spd-btn" onclick="setSpeed(0.5)">0.5×</button>
      <button class="spd-btn active" onclick="setSpeed(1)">1×</button>
      <button class="spd-btn" onclick="setSpeed(2)">2×</button>
      <button class="spd-btn" onclick="setSpeed(4)">4×</button>
    </div>
    <span id="tick-lbl">—</span>
  </div>
</div>

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────────────────────
const RADAR_SIZE = 1024;
const SAMPLE_TICKS = 16; // matches converter sampleTicks

// PlayerState compact array indices (matches UnifiedPlayerState MarshalJSON)
const PS_IDX=0, PS_FLAGS=1, PS_HP=2, PS_X=3, PS_Y=4, PS_Z=5, PS_YAW=6;

// Kill compact array indices
const K_TICK=0, K_ATK=1, K_VIC=2, K_WEP=3, K_HS=4, K_AX=5, K_AY=6, K_VX=7, K_VY=8, K_ASST=9, K_FA=10;

// Grenade compact array indices
const G_T0=0, G_T1=1, G_TYPE=2, G_X=3, G_Y=4, G_THROWER=5;

// Trail compact array indices
const TR_T0=0, TR_T1=1, TR_TYPE=2, TR_THROWER=3, TR_PTS=4;
const TR_PT_T=0, TR_PT_X=1, TR_PT_Y=2;

// Bomb compact array indices
const B_TICK=0, B_ACTION=1, B_X=2, B_Y=3, B_SITE=4;

// Shot compact array indices
const SH_TICK=0, SH_IDX=1;

// Flag bits
const FLAG_DEAD = 1, FLAG_T = 2, FLAG_BOMB = 4;

// Grenade types
const G_SMOKE=0, G_FLASH=1, G_HE=2, G_MOLOTOV=3, G_SMOKE_CT=4, G_SMOKE_T=5;

const SHOOT_FLASH_TICKS = 12;  // ring persists ~0.2 s after a shot
const GREN_FADE_TICKS   = 64;  // flash/HE burst fades over ~1 s

// Team colors
const COLOR_T   = '#f97316';
const COLOR_CT  = '#38bdf8';
const COLOR_T_D = '#7c3500';
const COLOR_CT_D= '#164e63';

// ── State ──────────────────────────────────────────────────────────────────────
let DATA = null;
let currentClipIdx = -1;
let clip = null;       // currently selected execClip
let mapInfo = null;    // currently selected execMapData
let framePos = 0;      // fractional frame index
let playing = false;
let speed = 1;
let lastTS = null;
let rafID = null;
let zoom = 1, panX = 0, panY = 0;
let dragging = false, dragStartX = 0, dragStartY = 0, dragPanX = 0, dragPanY = 0;
let clipStartFrame = 0; // first frame at/after freeze end tick
let mouseX = 0, mouseY = 0; // for zoom-toward-cursor
let lastFeedSig = ''; // kill feed change detection

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const radarImg = new Image();
let radarReady = false;
radarImg.onload = () => { radarReady = true; render(); };

// ── Startup ────────────────────────────────────────────────────────────────────
const DATA_GZ = "/*INJECT_DATA*/";

(async () => {
  const raw = Uint8Array.from(atob(DATA_GZ), c => c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(raw); writer.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  DATA = JSON.parse(new TextDecoder().decode(buf));

  document.getElementById('sb-count').textContent =
    DATA.clips.length + ' rounds';
  buildSidebar();
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  canvas.addEventListener('mousedown', e => {
    dragging = true; dragStartX = e.clientX; dragStartY = e.clientY;
    dragPanX = panX; dragPanY = panY;
  });
  canvas.addEventListener('mousemove', e => {
    if (dragging) {
      panX = dragPanX + (e.clientX - dragStartX);
      panY = dragPanY + (e.clientY - dragStartY);
      clampPan(); render();
    }
  });
  canvas.addEventListener('mouseup', () => { dragging = false; });
  canvas.addEventListener('mouseleave', () => { dragging = false; });
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    const newZoom = Math.max(1, Math.min(8, zoom * factor));
    if (newZoom !== zoom) {
      panX = mouseX - (mouseX - canvas.width  / 2 - panX) * (newZoom / zoom) - canvas.width  / 2;
      panY = mouseY - (mouseY - canvas.height / 2 - panY) * (newZoom / zoom) - canvas.height / 2;
      zoom = newZoom;
    }
    clampPan(); render();
  }, {passive: false});

  // Select first clip automatically.
  if (DATA.clips.length > 0) selectClip(0);
})();

// ── Sidebar ────────────────────────────────────────────────────────────────────
function buyClass(t) {
  if (t === 'full')   return 'buy-full';
  if (t === 'force')  return 'buy-force';
  if (t === 'eco')    return 'buy-eco';
  return 'buy-pistol';
}

function buildSidebar() {
  const list = document.getElementById('clip-list');
  DATA.clips.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'clip-item';
    div.id = 'clip-' + i;

    const mapShort = c.map.replace('de_', '');
    const wonHTML  = c.winner === 'T'
      ? '<span class="won-t">T won</span>'
      : '<span class="won-ct">CT won</span>';
    const plantHTML = c.planted
      ? '<span class="plant-badge">💣plant</span>' : '';
    const defHTML   = c.defused ? '<span class="def-badge">defused</span>' : '';
    const smkT      = c.smokes_t  > 0 ? `<span class="tag-smk">${c.smokes_t}S</span>`  : '';
    const flaT      = c.flashes_t > 0 ? `<span class="tag-fla">${c.flashes_t}F</span>` : '';
    const molT      = c.molotovs_t> 0 ? `<span class="tag-mol">${c.molotovs_t}M</span>`: '';
    const entryHTML = c.entry ? (c.entry === 'T'
      ? `<span class="entry-t">ent:T</span>`
      : `<span class="entry-ct">ent:CT</span>`) : '';

    div.innerHTML = `
      <div class="ci-top">
        <span class="ci-date">${c.date}</span>
        <span class="ci-map">${mapShort}</span>
      </div>
      <div class="ci-match" title="${c.match}">${trunc(c.match, 38)}</div>
      <div class="ci-meta">
        <span class="ci-rnd">R${c.rnd}</span>
        <span class="${buyClass(c.type_t)}">T:${c.type_t}</span>
        <span class="${buyClass(c.type_ct)}">CT:${c.type_ct}</span>
        ${smkT}${flaT}${molT}
        ${plantHTML}${defHTML}
        ${wonHTML}${entryHTML}
      </div>`;
    div.addEventListener('click', () => selectClip(i));
    list.appendChild(div);
  });
}

function trunc(s, n) {
  return s.length > n ? s.slice(0, n-1) + '…' : s;
}

// ── Clip selection ─────────────────────────────────────────────────────────────
function selectClip(idx) {
  if (idx === currentClipIdx) return;

  // Deactivate previous.
  if (currentClipIdx >= 0) {
    const prev = document.getElementById('clip-' + currentClipIdx);
    if (prev) prev.classList.remove('active');
  }

  currentClipIdx = idx;
  clip = DATA.clips[idx];
  mapInfo = DATA.maps[clip.map] || null;

  const item = document.getElementById('clip-' + idx);
  if (item) {
    item.classList.add('active');
    item.scrollIntoView({block: 'nearest'});
  }

  // Load radar.
  radarReady = false;
  if (mapInfo && mapInfo.radar) {
    radarImg.src = mapInfo.radar;
  } else {
    radarImg.src = '';
  }

  // Find first frame at/after freeze end tick (skip freeze time).
  clipStartFrame = 0;
  const fe = clip.round_meta.fe;
  if (fe) {
    for (let i = 0; i < clip.frames.length; i++) {
      if (clip.frames[i].tick >= fe) { clipStartFrame = i; break; }
    }
  }

  // Reset playback.
  stop();
  framePos = clipStartFrame;
  zoom = 1; panX = 0; panY = 0;
  lastFeedSig = '';
  document.getElementById('killfeed').innerHTML = '';
  document.getElementById('hp-ct').innerHTML = '<div class="hp-hdr" style="color:#4fc3f7">CT</div>';
  document.getElementById('hp-t').innerHTML  = '<div class="hp-hdr" style="color:#f97316">T</div>';
  updateTimeline();
  updateHeader();
  enableControls(true);
  render();
}

function updateHeader() {
  if (!clip) return;
  document.getElementById('hdr-empty').style.display = 'none';

  const mapEl = document.getElementById('hdr-map');
  mapEl.textContent = clip.map;
  mapEl.style.display = '';

  const rndEl = document.getElementById('hdr-round');
  rndEl.textContent = `Round ${clip.rnd}`;
  rndEl.style.display = '';

  const utilParts = [];
  if (clip.smokes_t  > 0) utilParts.push(`T:${clip.smokes_t}S`);
  if (clip.flashes_t > 0) utilParts.push(`T:${clip.flashes_t}F`);
  if (clip.molotovs_t> 0) utilParts.push(`T:${clip.molotovs_t}M`);
  if (clip.smokes_ct > 0) utilParts.push(`CT:${clip.smokes_ct}S`);
  if (clip.flashes_ct> 0) utilParts.push(`CT:${clip.flashes_ct}F`);
  if (clip.molotovs_ct>0) utilParts.push(`CT:${clip.molotovs_ct}M`);
  if (clip.entry) utilParts.push(`entry:${clip.entry}`);
  const utilEl = document.getElementById('hdr-util');
  utilEl.textContent = utilParts.join(' · ');
  utilEl.style.display = utilParts.length > 0 ? '' : 'none';

  const outEl = document.getElementById('hdr-outcome');
  let outText = clip.winner === 'T' ? 'T won' : 'CT won';
  if (clip.planted) outText += clip.defused ? ' (defused)' : ' (bomb)';
  outEl.textContent = outText;
  outEl.className = clip.winner === 'T' ? 't-won' : 'ct-won';
  outEl.style.display = '';
}

function enableControls(on) {
  document.getElementById('play-btn').disabled = !on;
  document.getElementById('timeline').disabled = !on;
  if (on) {
    const tl = document.getElementById('timeline');
    tl.min = clipStartFrame;
    tl.max = clip.frames.length - 1;
    tl.value = clipStartFrame;
  }
}

// ── Playback ───────────────────────────────────────────────────────────────────
function togglePlay() {
  if (playing) stop(); else play();
}

function play() {
  if (!clip || clip.frames.length === 0) return;
  playing = true;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  lastTS = null;
  rafID = requestAnimationFrame(tick);
}

function stop() {
  playing = false;
  if (rafID) { cancelAnimationFrame(rafID); rafID = null; }
  document.getElementById('play-btn').textContent = '▶ Play';
}

function tick(ts) {
  if (!playing) return;
  if (lastTS !== null) {
    const dt = (ts - lastTS) / 1000;
    // 4 fps keyframes → framePos advances at speed * 4 frames/sec wall time
    framePos += dt * speed * 4;
    if (framePos >= clip.frames.length - 1) {
      framePos = clip.frames.length - 1;
      stop();
    }
  }
  lastTS = ts;
  updateTimeline();
  render();
  if (playing) rafID = requestAnimationFrame(tick);
}

function onScrub(val) {
  stop();
  framePos = parseFloat(val);
  updateTimeline();
  render();
}

function setSpeed(s) {
  speed = s;
  document.querySelectorAll('.spd-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.textContent) === s);
  });
}

function updateTimeline() {
  if (!clip) return;
  const tl = document.getElementById('timeline');
  tl.value = framePos;

  // Compute time label from tick.
  const fi = Math.min(Math.floor(framePos), clip.frames.length - 1);
  const frame = clip.frames[fi];
  if (frame && clip.tickrate > 0) {
    const secs = (frame.tick - clip.round_meta.fe) / clip.tickrate;
    const label = secs < 0 ? '0:00' : fmtTime(secs);
    document.getElementById('tick-lbl').textContent = label;
  }
}

function fmtTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return m + ':' + String(s).padStart(2, '0');
}

// ── Canvas ─────────────────────────────────────────────────────────────────────
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const sz = Math.min(wrap.clientWidth, wrap.clientHeight);
  canvas.width  = sz;
  canvas.height = sz;
  clampPan();
  render();
}

function clampPan() {
  const maxPan = canvas.width / 2 * (zoom - 1);
  panX = Math.max(-maxPan, Math.min(maxPan, panX));
  panY = Math.max(-maxPan, Math.min(maxPan, panY));
}

// World coordinates → canvas pixel coordinates.
function w2c(wx, wy) {
  if (!mapInfo) return [0, 0];
  const m = mapInfo.meta;
  const cs = canvas.width / RADAR_SIZE;
  const bx = ((wx - m.pos_x) / m.scale) * cs;
  const by = ((m.pos_y - wy) / m.scale) * cs;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  return [(bx - cx) * zoom + cx + panX, (by - cy) * zoom + cy + panY];
}

function worldRToPx(r) {
  if (!mapInfo) return 0;
  return zoom * (r / mapInfo.meta.scale) * (canvas.width / RADAR_SIZE);
}

// ── Interpolation ──────────────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }

function lerpAngle(a, b, t) {
  let diff = ((b - a + 540) % 360) - 180;
  return (a + diff * t + 360) % 360;
}

function interpFramePos(fp) {
  const frames = clip.frames;
  const fi = Math.floor(fp);
  const t  = fp - fi;
  const f0 = frames[Math.min(fi, frames.length - 1)];
  const f1 = frames[Math.min(fi + 1, frames.length - 1)];
  if (!f0) return [];
  if (!f1 || f0 === f1 || t === 0) return f0.p;

  // Build index map from f0.
  const m0 = {};
  for (const ps of f0.p) m0[ps[PS_IDX]] = ps;

  return f1.p.map(ps1 => {
    const ps0 = m0[ps1[PS_IDX]];
    if (!ps0) return ps1;
    return [
      ps1[PS_IDX], ps1[PS_FLAGS], ps1[PS_HP],
      Math.round(lerp(ps0[PS_X], ps1[PS_X], t)),
      Math.round(lerp(ps0[PS_Y], ps1[PS_Y], t)),
      Math.round(lerp(ps0[PS_Z], ps1[PS_Z], t)),
      Math.round(lerpAngle(ps0[PS_YAW], ps1[PS_YAW], t)),
    ];
  });
}

// Get the current in-game tick for the fractional frame position.
function currentTick() {
  if (!clip || clip.frames.length === 0) return 0;
  const fi = Math.min(Math.floor(framePos), clip.frames.length - 1);
  const t  = framePos - fi;
  const f0 = clip.frames[fi];
  const f1 = clip.frames[Math.min(fi + 1, clip.frames.length - 1)];
  if (!f1 || f0 === f1) return f0.tick;
  return Math.round(lerp(f0.tick, f1.tick, t));
}

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!clip) {
    ctx.fillStyle = '#21262d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#6e7681';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Select a round from the sidebar', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'left';
    return;
  }

  // Background.
  ctx.fillStyle = '#1c2128';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Radar image (zoom/pan applied so map moves with players).
  if (radarReady) {
    const imgX = canvas.width  / 2 * (1 - zoom) + panX;
    const imgY = canvas.height / 2 * (1 - zoom) + panY;
    ctx.drawImage(radarImg, imgX, imgY, canvas.width * zoom, canvas.height * zoom);
    // Dim slightly for readability.
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const tick = currentTick();
  const players = interpFramePos(framePos);

  // In-flight grenade projectiles (pulsing dot at current position, no path history).
  const sc = canvas.width / RADAR_SIZE;
  const PROJ_COLORS = {
    [G_FLASH]:    'rgba(240,240,100,1)',
    [G_HE]:       'rgba(255,160,30,1)',
    [G_MOLOTOV]:  'rgba(255,100,20,1)',
    [G_SMOKE_T]:  'rgba(249,115,22,1)',
    [G_SMOKE_CT]: 'rgba(56,189,248,1)',
    [G_SMOKE]:    'rgba(200,200,200,1)',
  };
  for (const tr of clip.trails) {
    const pts2 = tr[TR_PTS];
    if (!pts2 || pts2.length < 2) continue;
    // Find landing tick from last significant trajectory movement.
    let landIdx = 0;
    for (let i = 1; i < pts2.length; i++) {
      const dx = pts2[i][TR_PT_X] - pts2[i-1][TR_PT_X];
      const dy = pts2[i][TR_PT_Y] - pts2[i-1][TR_PT_Y];
      if (dx*dx + dy*dy >= 9) landIdx = i;
    }
    let landTick = tr[TR_T0] + pts2[landIdx][TR_PT_T];
    // For HE and flash, use authoritative detonation tick from grenades.
    if (tr[TR_TYPE] === G_HE || tr[TR_TYPE] === G_FLASH) {
      let bestDet = null, bestDiff = Infinity;
      for (const g of clip.grenades) {
        if (g[G_TYPE] !== tr[TR_TYPE] || g[G_THROWER] !== tr[TR_THROWER]) continue;
        if (g[G_T0] < tr[TR_T0]) continue;
        const diff = Math.abs(g[G_T0] - landTick);
        if (diff < bestDiff) { bestDiff = diff; bestDet = g; }
      }
      if (bestDet) landTick = bestDet[G_T0];
    }
    if (tick < tr[TR_T0] || tick >= landTick) continue;
    const pos = interpTrailPos(tr, tick);
    if (!pos) continue;
    const [gx, gy] = w2c(pos[0], pos[1]);
    const color = PROJ_COLORS[tr[TR_TYPE]] || 'rgba(200,200,200,1)';
    const pr = Math.max(4, Math.round(5 * sc));
    const pulse = 0.5 + 0.5 * Math.sin(tick / 4 * Math.PI);
    ctx.save();
    ctx.globalAlpha = pulse * 0.7;
    ctx.beginPath();
    ctx.arc(gx, gy, pr * (1.6 + 0.6 * pulse), 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.5, sc * 1.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(gx, gy, pr, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = Math.max(1, sc);
    ctx.stroke();
    ctx.restore();
  }

  // Draw active grenades (smokes, molotovs; flash/HE handled separately).
  for (const g of clip.grenades) {
    if (tick < g[G_T0]) continue;
    if (g[G_TYPE] === G_FLASH || g[G_TYPE] === G_HE) {
      if (tick - g[G_T0] >= GREN_FADE_TICKS) continue; // fades out after 64 ticks
    } else {
      if (g[G_T1] > 0 && tick > g[G_T1]) continue;
    }
    drawGrenade(g, tick);
  }

  // Draw bomb plant marker.
  for (const b of clip.bombs) {
    if (b[B_ACTION] === 1 && tick >= b[B_TICK]) {
      drawBomb(b[B_X], b[B_Y]);
    }
  }

  // Draw kill markers (flash for 2 s after kill tick).
  for (const k of clip.kills) {
    if (tick >= k[K_TICK] && tick <= k[K_TICK] + clip.tickrate * 2) {
      drawKillMarker(k[K_VX], k[K_VY]);
    }
  }

  // Draw players (dead under alive).
  const alive = players.filter(ps => !(ps[PS_FLAGS] & FLAG_DEAD));
  const dead  = players.filter(ps =>  (ps[PS_FLAGS] & FLAG_DEAD));
  for (const ps of dead)  drawPlayer(ps, tick);
  for (const ps of alive) drawPlayer(ps, tick);

  // Update HUD overlays.
  updateKillFeed(tick);
  updateHealthPanel(players);
}

// ── Drawing helpers ────────────────────────────────────────────────────────────
function drawPlayer(ps, tick) {
  const isT    = (ps[PS_FLAGS] & FLAG_T)    !== 0;
  const isBomb = (ps[PS_FLAGS] & FLAG_BOMB) !== 0;
  const isAlive= !(ps[PS_FLAGS] & FLAG_DEAD);
  const [cx, cy] = w2c(ps[PS_X], ps[PS_Y]);
  const sc  = canvas.width / RADAR_SIZE;
  const r   = Math.max(4, worldRToPx(35));
  const lw  = Math.max(1.5, sc * 1.5);

  if (!isAlive) {
    // Dead → X mark, team-colored
    const d = r * 0.65;
    ctx.strokeStyle = isT ? 'rgba(200,100,30,0.7)' : 'rgba(40,140,210,0.7)';
    ctx.lineWidth   = lw;
    ctx.beginPath();
    ctx.moveTo(cx-d, cy-d); ctx.lineTo(cx+d, cy+d);
    ctx.moveTo(cx+d, cy-d); ctx.lineTo(cx-d, cy+d);
    ctx.stroke();
    return;
  }

  // Yaw direction line
  const yawRad = (ps[PS_YAW] * Math.PI) / 180;
  const dLen   = r * 1.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth   = lw;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(yawRad) * dLen, cy - Math.sin(yawRad) * dLen);
  ctx.stroke();

  // Body circle
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle   = isT ? COLOR_T : COLOR_CT;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth   = Math.max(1, sc);
  ctx.stroke();

  // Bomb indicator
  if (isBomb) {
    const br = Math.max(4, Math.round(5 * sc));
    ctx.beginPath();
    ctx.arc(cx + r * 0.7, cy - r * 0.7, br, 0, Math.PI * 2);
    ctx.fillStyle   = '#ffd700';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth   = 1;
    ctx.stroke();
    ctx.font = `bold ${Math.max(6, Math.round(7 * sc))}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText('C', cx + r * 0.7, cy - r * 0.7);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  // Shoot flash ring
  const recentShot = (clip.shots || []).find(
    s => s[SH_IDX] === ps[PS_IDX] && tick - s[SH_TICK] >= 0 && tick - s[SH_TICK] < SHOOT_FLASH_TICKS
  );
  if (recentShot) {
    const age    = tick - recentShot[SH_TICK];
    const alpha  = 1 - age / SHOOT_FLASH_TICKS;
    const flashR = r * (1.3 + age / SHOOT_FLASH_TICKS * 1.2);
    ctx.beginPath();
    ctx.arc(cx, cy, flashR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,180,${alpha.toFixed(2)})`;
    ctx.lineWidth   = Math.max(1, lw * 1.5);
    ctx.stroke();
  }

  // Name label
  const name  = (clip.players[ps[PS_IDX]] || {}).name || '?';
  const label = name.length > 10 ? name.slice(0, 9) + '…' : name;
  const fSz   = Math.max(9, Math.round(10 * sc));
  ctx.font          = `bold ${fSz}px sans-serif`;
  ctx.textAlign     = 'center';
  ctx.textBaseline  = 'alphabetic';
  ctx.fillStyle     = '#000';
  ctx.fillText(label, cx + 1, cy - r - 3);
  ctx.fillStyle     = '#fff';
  ctx.fillText(label, cx, cy - r - 4);
  ctx.textAlign     = 'left';
  ctx.textBaseline  = 'alphabetic';
}

function drawGrenade(g, tick) {
  const [cx, cy] = w2c(g[G_X], g[G_Y]);
  const sc = canvas.width / RADAR_SIZE;
  switch (g[G_TYPE]) {
    case G_SMOKE_T:
    case G_SMOKE:
    case G_SMOKE_CT: {
      const r = Math.max(6, worldRToPx(130));
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      const isT = g[G_TYPE] === G_SMOKE_T;
      ctx.fillStyle   = isT ? 'rgba(249,115,22,0.28)' : 'rgba(56,189,248,0.28)';
      ctx.fill();
      ctx.strokeStyle = isT ? 'rgba(249,115,22,0.70)' : 'rgba(56,189,248,0.70)';
      ctx.lineWidth   = 1.5;
      ctx.stroke();
      break;
    }
    case G_FLASH: {
      // Expanding burst that fades over GREN_FADE_TICKS
      const age   = tick - g[G_T0];
      const t     = age / GREN_FADE_TICKS;
      const alpha = 1 - t;
      const burst = Math.max(4, worldRToPx(180) * (t * 0.75 + 0.15));
      const grad  = ctx.createRadialGradient(cx, cy, 0, cx, cy, burst);
      grad.addColorStop(0,    `rgba(240,240,255,${(alpha * 0.95).toFixed(2)})`);
      grad.addColorStop(0.45, `rgba(240,240,255,${(alpha * 0.55).toFixed(2)})`);
      grad.addColorStop(1,    'rgba(240,240,255,0)');
      ctx.beginPath(); ctx.arc(cx, cy, burst, 0, Math.PI * 2);
      ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, burst * 0.88, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(240,240,255,${(alpha * 0.8).toFixed(2)})`;
      ctx.lineWidth   = Math.max(2, sc * 2); ctx.stroke();
      break;
    }
    case G_HE: {
      const age   = tick - g[G_T0];
      const t     = age / GREN_FADE_TICKS;
      const alpha = 1 - t;
      const burst = Math.max(4, worldRToPx(180) * (t * 0.75 + 0.15));
      const grad  = ctx.createRadialGradient(cx, cy, 0, cx, cy, burst);
      grad.addColorStop(0,    `rgba(255,180,30,${(alpha * 0.95).toFixed(2)})`);
      grad.addColorStop(0.45, `rgba(255,180,30,${(alpha * 0.55).toFixed(2)})`);
      grad.addColorStop(1,    'rgba(255,180,30,0)');
      ctx.beginPath(); ctx.arc(cx, cy, burst, 0, Math.PI * 2);
      ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, burst * 0.88, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,180,30,${(alpha * 0.8).toFixed(2)})`;
      ctx.lineWidth   = Math.max(2, sc * 2); ctx.stroke();
      break;
    }
    case G_MOLOTOV: {
      const r = Math.max(5, worldRToPx(100));
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle   = 'rgba(239,68,68,0.35)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(239,68,68,0.80)';
      ctx.lineWidth   = 1.5;
      ctx.stroke();
      break;
    }
  }
}

function interpTrailPos(tr, tick) {
  const pts = tr[TR_PTS];
  if (!pts || pts.length === 0) return null;
  const elapsed = tick - tr[TR_T0];
  if (elapsed < 0) return null;
  if (pts.length === 1 || elapsed <= pts[0][TR_PT_T])
    return [pts[0][TR_PT_X], pts[0][TR_PT_Y]];
  for (let i = 0; i < pts.length - 1; i++) {
    const t0 = pts[i][TR_PT_T], t1 = pts[i+1][TR_PT_T];
    if (elapsed >= t0 && elapsed <= t1) {
      const frac = t1 > t0 ? (elapsed - t0) / (t1 - t0) : 0;
      return [
        lerp(pts[i][TR_PT_X], pts[i+1][TR_PT_X], frac),
        lerp(pts[i][TR_PT_Y], pts[i+1][TR_PT_Y], frac),
      ];
    }
  }
  const last = pts[pts.length - 1];
  return [last[TR_PT_X], last[TR_PT_Y]];
}

function drawKillMarker(wx, wy) {
  const [cx, cy] = w2c(wx, wy);
  const s = Math.max(4, worldRToPx(25));
  ctx.strokeStyle = '#f85149';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx + s, cy + s);
  ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx - s, cy + s);
  ctx.stroke();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Kill feed ─────────────────────────────────────────────────────────────────
function updateKillFeed(tick) {
  if (!clip) return;
  const kills = (clip.kills || []).filter(k => k[K_TICK] <= tick);
  const sig = kills.map(k => k[K_TICK]).join(',');
  const feedEl = document.getElementById('killfeed');
  if (sig !== lastFeedSig) {
    lastFeedSig = sig;
    feedEl.innerHTML = '';
    for (const k of kills.slice(-8).reverse()) {
      const atkName = (clip.players[k[K_ATK]] || {}).name || '?';
      const vicName = (clip.players[k[K_VIC]] || {}).name || '?';
      const hsHtml  = k[K_HS] ? '<span class="kf-hs">HS</span>' : '';
      const wep     = k[K_WEP] || '';
      const el = document.createElement('div');
      el.className   = 'kf-entry';
      el.dataset.kt  = k[K_TICK];
      el.innerHTML   =
        `<span class="kf-atk">${esc(atkName)}</span>` +
        `<span class="kf-wep">${esc(wep)}</span>` +
        `<span class="kf-sep">→</span>` +
        `<span class="kf-vic">${esc(vicName)}</span>` +
        hsHtml;
      feedEl.appendChild(el);
    }
  }
  // Fade entries that are more than 3 s old
  for (const el of feedEl.children) {
    const age = tick - parseInt(el.dataset.kt, 10);
    el.style.opacity = age < 192 ? '1' : Math.max(0.2, 1 - (age - 192) / 384).toFixed(2);
  }
}

// ── Health panel ──────────────────────────────────────────────────────────────
function updateHealthPanel(players) {
  if (!clip || !players) return;
  const ctEl = document.getElementById('hp-ct');
  const tEl  = document.getElementById('hp-t');
  const ct = [], t = [];
  for (const ps of players) {
    ((ps[PS_FLAGS] & FLAG_T) ? t : ct).push(ps);
  }
  ct.sort((a, b) => a[PS_IDX] - b[PS_IDX]);
  t.sort((a, b) => a[PS_IDX] - b[PS_IDX]);

  const renderSide = (container, list) => {
    // Keep header, rebuild player rows if count changed
    const hdr = container.firstElementChild;
    while (container.children.length > 1) container.removeChild(container.lastChild);
    for (const ps of list) {
      const name    = (clip.players[ps[PS_IDX]] || {}).name || '?';
      const isAlive = !(ps[PS_FLAGS] & FLAG_DEAD);
      const hp      = isAlive ? Math.max(0, ps[PS_HP]) : 0;
      const hpPct   = hp + '%';
      const barColor= hp > 50 ? '#2ea043' : hp > 25 ? '#d29922' : '#f85149';
      const row = document.createElement('div');
      row.className = 'hp-row' + (isAlive ? '' : ' hp-dead');
      row.innerHTML =
        `<div class="hp-name-row">` +
        `<span class="hp-name">${esc(name)}</span>` +
        `<span class="hp-val">${isAlive ? hp : '✕'}</span>` +
        `</div>` +
        `<div class="hp-bar-wrap"><div class="hp-bar" style="width:${hpPct};background:${barColor}"></div></div>`;
      container.appendChild(row);
    }
  };
  renderSide(ctEl, ct);
  renderSide(tEl, t);
}

function drawBomb(wx, wy) {
  const [cx, cy] = w2c(wx, wy);
  const r = Math.max(4, worldRToPx(30));
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,215,0,0.6)';
  ctx.fill();
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.stroke();
  // "C4" label.
  ctx.fillStyle = '#000';
  ctx.font = `bold ${Math.max(7, r * 0.9)}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('C4', cx, cy);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}
</script>
